<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления рассылкой</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tgBg: 'var(--tg-theme-bg-color, #ffffff)',
                        tgText: 'var(--tg-theme-text-color, #000000)',
                        tgBtn: 'var(--tg-theme-button-color, #3390ec)',
                        tgBtnText: 'var(--tg-theme-button-text-color, #ffffff)',
                    }
                }
            }
        }
    </script>
    <style>
        .table-container {
            width: 100%;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background-color: #f8fafc;
            font-weight: 600;
            color: #475569;
            white-space: nowrap;
        }
        tbody tr:nth-child(even) {
            background-color: #f8fafc;
        }
        .text-truncate {
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: inline-block;
        }
        .text-truncate:hover {
            white-space: normal;
            overflow: visible;
            background-color: white;
            position: relative;
            z-index: 10;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 4px;
            border-radius: 4px;
        }
        .tab-btn {
            transition: all 0.2s ease-in-out;
        }
    </style>
</head>
<body class="bg-tgBg text-tgText p-5 font-sans">
    <h2 class="text-xl font-bold mb-4">Панель управления</h2>
    
    <div class="flex justify-between items-center border-b border-gray-300 mb-6">
        <div class="flex">
            <button id="btn_send" onclick="switchTab('send')" class="tab-btn py-2 px-4 border-b-2 font-medium text-blue-600 border-blue-600 focus:outline-none">Рассылка</button>
            <button id="btn_history" onclick="switchTab('history')" class="tab-btn py-2 px-4 border-b-2 font-medium text-gray-500 border-transparent hover:text-gray-700 hover:border-gray-300 focus:outline-none">История</button>
        </div>
        <a href="/api/export" target="_blank" class="mb-2 bg-green-500 hover:bg-green-600 text-white text-sm py-2 px-4 rounded font-medium shadow-sm transition-colors">📥 Скачать базу (Excel)</a>
    </div>
    
    <div id="tab_send">
        <div class="bg-white p-4 rounded shadow-sm border border-gray-200 mb-8">
            <label for="target_type" class="block mb-2 font-medium">Тип рассылки:</label>
            <select id="target_type" class="w-full mb-4 p-3 border rounded border-gray-300 text-black bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="toggleFields()">
                <option value="all">Всем родителям</option>
                <option value="class">Определенному классу</option>
                <option value="student">Конкретному ученику (родителю)</option>
            </select>
            
            <div id="class_block" class="hidden mb-4">
                <label for="class_select" class="block mb-2 font-medium">Выберите класс:</label>
                <select id="class_select" class="w-full p-3 border rounded border-gray-300 text-black bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="handleClassChange()">
                    <option value="">-- Выберите класс --</option>
                </select>
            </div>

            <div id="student_block" class="hidden mb-4">
                <label for="student_select" class="block mb-2 font-medium">Выберите ученика:</label>
                <select id="student_select" class="w-full p-3 border rounded border-gray-300 text-black bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">-- Выберите ученика --</option>
                </select>
            </div>

            <label for="template_select" class="block mb-2 font-medium">Шаблоны сообщений:</label>
            <select id="template_select" class="w-full mb-4 p-3 border rounded border-gray-300 text-black bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="applyTemplate()">
                <option value="">-- Ввести текст вручную --</option>
                <option value="Уважаемые родители! Напоминаем, что завтра состоится родительское собрание. Явка обязательна.">Родительское собрание</option>
                <option value="Внимание! В связи с погодными условиями занятия сегодня отменяются.">Отмена занятий</option>
                <option value="Уважаемые родители, просим срочно заполнить и передать классному руководителю форму согласия.">Сбор документов</option>
                <option value="Напоминаем о необходимости своевременной оплаты за обучение.">Оплата за обучение</option>
            </select>
            
            <label for="message" class="block mb-2 font-medium">Текст сообщения:</label>
            <textarea id="message" class="w-full h-32 p-3 mb-4 border rounded border-gray-300 resize-y text-black bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Введите текст оповещения..."></textarea>
            
            <button onclick="sendMessage()" class="w-full bg-tgBtn text-tgBtnText p-4 rounded font-bold hover:opacity-90 transition-opacity">Отправить</button>
            <p id="status" class="mt-4 font-medium text-center"></p>
        </div>
    </div>

    <div id="tab_history" class="hidden">
        <div class="table-container bg-white rounded shadow-sm border border-gray-200">
            <table class="text-black">
                <thead>
                    <tr>
                        <th class="w-12">№</th>
                        <th>Ученик / Класс</th>
                        <th>Родитель</th>
                        <th>Сообщение</th>
                        <th>Тип</th>
                        <th>Ознакомились</th>
                        <th>Время</th>
                    </tr>
                </thead>
                <tbody id="history_tbody">
                    <tr>
                        <td colspan="7" class="text-center py-4 text-gray-500">Загрузка истории...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function switchTab(tabId) {
            const tabSend = document.getElementById('tab_send');
            const tabHistory = document.getElementById('tab_history');
            const btnSend = document.getElementById('btn_send');
            const btnHistory = document.getElementById('btn_history');

            if (tabId === 'send') {
                tabSend.classList.remove('hidden');
                tabHistory.classList.add('hidden');
                
                btnSend.className = "tab-btn py-2 px-4 border-b-2 font-medium text-blue-600 border-blue-600 focus:outline-none";
                btnHistory.className = "tab-btn py-2 px-4 border-b-2 font-medium text-gray-500 border-transparent hover:text-gray-700 hover:border-gray-300 focus:outline-none";
            } else {
                tabSend.classList.add('hidden');
                tabHistory.classList.remove('hidden');
                
                btnHistory.className = "tab-btn py-2 px-4 border-b-2 font-medium text-blue-600 border-blue-600 focus:outline-none";
                btnSend.className = "tab-btn py-2 px-4 border-b-2 font-medium text-gray-500 border-transparent hover:text-gray-700 hover:border-gray-300 focus:outline-none";
                
                loadHistory(); 
            }
        }

        function applyTemplate() {
            const template = document.getElementById('template_select').value;
            if (template) {
                document.getElementById('message').value = template;
            }
        }

        async function loadClasses() {
            try {
                const response = await fetch('/api/classes');
                const data = await response.json();
                const select = document.getElementById('class_select');
                
                data.classes.forEach(cls => {
                    const option = document.createElement('option');
                    option.value = cls;
                    option.textContent = `Класс ${cls}`;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error("Ошибка загрузки классов:", error);
            }
        }

        async function loadHistory() {
            const tbody = document.getElementById('history_tbody');
            try {
                const response = await fetch('/api/history');
                const data = await response.json();
                
                tbody.innerHTML = '';
                
                if (data.history.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-gray-500">История рассылок пуста.</td></tr>';
                    return;
                }

                data.history.forEach((item, index) => {
                    const tr = document.createElement('tr');
                    
                    let targetInfo = item.target;
                    let typeLabel = "Индивидуальная";
                    let studentName = "-";
                    let parentName = "-";
                    let className = "-";
                    
                    if (targetInfo === "Всем родителям") {
                        typeLabel = "Массовая (Всем)";
                        studentName = "Все ученики";
                        parentName = "Все родители";
                    } else if (targetInfo.startsWith("Класс")) {
                        typeLabel = "По классу";
                        className = targetInfo.replace("Класс ", "");
                        studentName = `Все ученики (${className})`;
                        parentName = `Родители (${className})`;
                    } else if (targetInfo.includes("(")) {
                        const parts = targetInfo.split(" (реб. ");
                        if (parts.length === 2) {
                            parentName = parts[0];
                            const studentData = parts[1].replace(")", "").split(", ");
                            if (studentData.length === 2) {
                                studentName = studentData[0];
                                className = studentData[1];
                            }
                        }
                    } else {
                         parentName = targetInfo;
                    }

                    tr.innerHTML = `
                        <td class="font-medium text-gray-600">${index + 1}</td>
                        <td>
                            <div class="font-medium">${studentName}</div>
                            ${className !== '-' ? `<div class="text-xs text-gray-500">${className}</div>` : ''}
                        </td>
                        <td>${parentName}</td>
                        <td>
                            <span class="text-truncate cursor-help" title="${item.text.replace(/"/g, '&quot;')}">
                                ${item.text}
                            </span>
                        </td>
                        <td><span class="px-2 py-1 bg-gray-100 text-gray-600 rounded text-xs font-medium">${typeLabel}</span></td>
                        <td><span class="px-2 py-1 bg-green-100 text-green-700 rounded text-xs font-bold">${item.ack_count}</span></td>
                        <td class="text-gray-500 whitespace-nowrap">${item.time}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-red-500">Ошибка загрузки истории.</td></tr>';
            }
        }

        function toggleFields() {
            const type = document.getElementById('target_type').value;
            const classBlock = document.getElementById('class_block');
            const studentBlock = document.getElementById('student_block');
            
            if (type === 'all') {
                classBlock.classList.add('hidden');
                studentBlock.classList.add('hidden');
            } else if (type === 'class') {
                classBlock.classList.remove('hidden');
                studentBlock.classList.add('hidden');
            } else if (type === 'student') {
                classBlock.classList.remove('hidden');
                studentBlock.classList.remove('hidden');
                handleClassChange();
            }
        }

        async function handleClassChange() {
            const type = document.getElementById('target_type').value;
            const className = document.getElementById('class_select').value;
            const studentSelect = document.getElementById('student_select');
            
            if (type === 'student' && className) {
                studentSelect.innerHTML = '<option value="">Загрузка...</option>';
                try {
                    const response = await fetch(`/api/students/${className}`);
                    const data = await response.json();
                    
                    studentSelect.innerHTML = '<option value="">-- Выберите ученика --</option>';
                    data.students.forEach(student => {
                        const option = document.createElement('option');
                        option.value = student.telegram_id;
                        option.textContent = student.child_full_name;
                        studentSelect.appendChild(option);
                    });
                } catch (error) {
                    studentSelect.innerHTML = '<option value="">Ошибка загрузки</option>';
                }
            } else {
                studentSelect.innerHTML = '<option value="">-- Выберите ученика --</option>';
            }
        }

        async function sendMessage() {
            const targetType = document.getElementById('target_type').value;
            let targetValue = 'all';
            
            if (targetType === 'class') {
                targetValue = document.getElementById('class_select').value;
                if (!targetValue) {
                    showStatus('Выберите класс для отправки!', 'text-red-500');
                    return;
                }
            } else if (targetType === 'student') {
                targetValue = document.getElementById('student_select').value;
                if (!targetValue) {
                    showStatus('Выберите ученика для отправки!', 'text-red-500');
                    return;
                }
            }

            const text = document.getElementById('message').value;
            if (!text.trim()) {
                showStatus('Введите текст сообщения!', 'text-red-500');
                return;
            }
            
            showStatus('Отправка...', 'text-blue-500');
            
            try {
                const response = await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target_type: targetType, target_value: targetValue, text: text })
                });
                
                const result = await response.json();
                if (result.status === 'success') {
                    showStatus(`Успешно отправлено ${result.count} родителям.`, 'text-green-500');
                    document.getElementById('message').value = '';
                    document.getElementById('template_select').value = '';
                    
                    setTimeout(() => switchTab('history'), 1500);
                } else {
                    showStatus('Ошибка на сервере при отправке.', 'text-red-500');
                }
            } catch (error) {
                showStatus('Ошибка соединения с сервером.', 'text-red-500');
            }
        }

        function showStatus(text, colorClass) {
            const statusEl = document.getElementById('status');
            statusEl.innerText = text;
            statusEl.className = `mt-4 font-medium text-center ${colorClass}`;
        }

        loadClasses();
        loadHistory();
    </script>
</body>
</html>
