<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tgBg: 'var(--tg-theme-bg-color, #ffffff)',
                        tgText: 'var(--tg-theme-text-color, #000000)',
                        tgBtn: 'var(--tg-theme-button-color, #3390ec)',
                        tgBtnText: 'var(--tg-theme-button-text-color, #ffffff)',
                    }
                }
            }
        }
    </script>
    <style>
        .table-container {
            width: 100%;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background-color: #f8fafc;
            font-weight: 600;
            color: #475569;
            white-space: nowrap;
        }
        tbody tr:nth-child(even) {
            background-color: #f8fafc;
        }
        .text-truncate {
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: inline-block;
        }
        .text-truncate:hover {
            white-space: normal;
            overflow: visible;
            background-color: white;
            position: relative;
            z-index: 10;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 4px;
            border-radius: 4px;
        }
        .tab-btn {
            transition: all 0.2s ease-in-out;
        }
    </style>
</head>
<body class="bg-tgBg text-tgText p-5 font-sans">
    <h2 class="text-xl font-bold mb-4">Панель управления</h2>
    
    <div class="flex justify-between items-center border-b border-gray-300 mb-6">
        <div class="flex">
            <button id="btn_send" onclick="switchTab('send')" class="tab-btn py-2 px-4 border-b-2 font-medium text-blue-600 border-blue-600 focus:outline-none">Рассылка</button>
            <button id="btn_history" onclick="switchTab('history')" class="tab-btn py-2 px-4 border-b-2 font-medium text-gray-500 border-transparent hover:text-gray-700 hover:border-gray-300 focus:outline-none">История</button>
            <button id="btn_db" onclick="switchTab('db')" class="tab-btn py-2 px-4 border-b-2 font-medium text-gray-500 border-transparent hover:text-gray-700 hover:border-gray-300 focus:outline-none">База данных</button>
        </div>
        <a href="/api/export" target="_blank" class="mb-2 bg-green-500 hover:bg-green-600 text-white text-sm py-2 px-4 rounded font-medium shadow-sm transition-colors">📥 Скачать базу (Excel)</a>
    </div>
    
    <div id="tab_send">
        <div class="bg-white p-4 rounded shadow-sm border border-gray-200 mb-8">
            <label for="target_type" class="block mb-2 font-medium">Тип рассылки:</label>
            <select id="target_type" class="w-full mb-4 p-3 border rounded border-gray-300 text-black bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="toggleFields()">
                <option value="all">Всем родителям</option>
                <option value="class">Определенному классу</option>
                <option value="student">Конкретному ученику (родителю)</option>
            </select>
            
            <div id="class_block" class="hidden mb-4">
                <label for="class_select" class="block mb-2 font-medium">Выберите класс:</label>
                <select id="class_select" class="w-full p-3 border rounded border-gray-300 text-black bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="handleClassChange()">
                    <option value="">-- Выберите класс --</option>
                </select>
            </div>

            <div id="student_block" class="hidden mb-4">
                <label for="student_select" class="block mb-2 font-medium">Выберите ученика:</label>
                <select id="student_select" class="w-full p-3 border rounded border-gray-300 text-black bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="handleStudentChange()">
                    <option value="">-- Выберите ученика --</option>
                </select>
            </div>

            <div id="parent_block" class="hidden mb-4">
                <label for="parent_select" class="block mb-2 font-medium">Выберите родителя:</label>
                <select id="parent_select" class="w-full p-3 border rounded border-gray-300 text-black bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">-- Выберите родителя --</option>
                </select>
            </div>

            <label for="template_select" class="block mb-2 font-medium">Шаблоны сообщений:</label>
            <select id="template_select" class="w-full mb-4 p-3 border rounded border-gray-300 text-black bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="applyTemplate()">
                <option value="">-- Ввести текст вручную --</option>
                <option value="Уважаемые родители! Напоминаем, что завтра состоится родительское собрание. Явка обязательна.">Родительское собрание</option>
                <option value="Внимание! В связи с погодными условиями занятия сегодня отменяются.">Отмена занятий</option>
                <option value="Уважаемые родители, просим срочно заполнить и передать классному руководителю форму согласия.">Сбор документов</option>
                <option value="Напоминаем о необходимости своевременной оплаты за обучение.">Оплата за обучение</option>
            </select>
            
            <label for="message" class="block mb-2 font-medium">Текст сообщения:</label>
            <textarea id="message" class="w-full h-32 p-3 mb-4 border rounded border-gray-300 resize-y text-black bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Введите текст оповещения..."></textarea>
            
            <button onclick="sendMessage()" class="w-full bg-tgBtn text-tgBtnText p-4 rounded font-bold hover:opacity-90 transition-opacity">Отправить</button>
            <p id="status" class="mt-4 font-medium text-center"></p>
        </div>
    </div>

    <div id="tab_history" class="hidden">
        <div class="table-container bg-white rounded shadow-sm border border-gray-200">
            <table class="text-black">
                <thead>
                    <tr>
                        <th class="w-12">№</th>
                        <th>Ученик / Класс</th>
                        <th>Родитель</th>
                        <th>Сообщение</th>
                        <th>Тип</th>
                        <th>Ознакомились</th>
                        <th>Время</th>
                    </tr>
                </thead>
                <tbody id="history_tbody">
                    <tr>
                        <td colspan="7" class="text-center py-4 text-gray-500">Загрузка истории...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="tab_db" class="hidden">
        <div class="table-container bg-white rounded shadow-sm border border-gray-200">
            <table class="text-black w-full">
                <thead>
                    <tr>
                        <th class="w-12">ID</th>
                        <th>ФИО Родителя</th>
                        <th>ФИО Ребенка</th>
                        <th>Класс</th>
                        <th>Email / Телефон</th>
                        <th>Адрес</th>
                        <th class="text-center">Действия</th>
                    </tr>
                </thead>
                <tbody id="db_tbody">
                    <tr>
                        <td colspan="7" class="text-center py-4 text-gray-500">Загрузка базы данных...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Модальное окно для редактирования -->
    <div id="edit_modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden flex justify-center items-center z-50">
        <div class="bg-white rounded p-6 w-full max-w-lg mx-4 text-black shadow-lg">
            <h3 class="text-xl font-bold mb-4">Редактирование записи</h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-sm font-medium mb-1">ФИО Родителя</label>
                    <input type="text" id="edit_parent_name" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">ФИО Ребенка</label>
                    <input type="text" id="edit_child_name" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Класс (например, 5А)</label>
                    <input type="text" id="edit_school_class" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Email</label>
                    <input type="text" id="edit_email" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Телефон</label>
                    <input type="text" id="edit_phone" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Адрес</label>
                    <input type="text" id="edit_address" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>
            <div class="mt-6 flex justify-end space-x-3">
                <button onclick="closeEditModal()" class="px-4 py-2 bg-gray-200 text-gray-800 rounded font-medium hover:bg-gray-300 transition-colors">Отмена</button>
                <button onclick="saveParent()" class="px-4 py-2 bg-blue-600 text-white rounded font-medium hover:bg-blue-700 transition-colors">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        let currentClassData = [];
        let editingParentId = null;

        function switchTab(tabId) {
            const tabs = ['send', 'history', 'db'];
            tabs.forEach(tab => {
                document.getElementById(`tab_${tab}`).classList.add('hidden');
                document.getElementById(`btn_${tab}`).className = "tab-btn py-2 px-4 border-b-2 font-medium text-gray-500 border-transparent hover:text-gray-700 hover:border-gray-300 focus:outline-none";
            });

            document.getElementById(`tab_${tabId}`).classList.remove('hidden');
            document.getElementById(`btn_${tabId}`).className = "tab-btn py-2 px-4 border-b-2 font-medium text-blue-600 border-blue-600 focus:outline-none";

            if (tabId === 'history') loadHistory();
            if (tabId === 'db') loadDb();
        }

        function applyTemplate() {
            const template = document.getElementById('template_select').value;
            if (template) {
                document.getElementById('message').value = template;
            }
        }

        async function loadClasses() {
            try {
                const response = await fetch('/api/classes');
                const data = await response.json();
                const select = document.getElementById('class_select');
                
                data.classes.forEach(cls => {
                    const option = document.createElement('option');
                    option.value = cls;
                    option.textContent = `Класс ${cls}`;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error("Ошибка загрузки классов:", error);
            }
        }

        async function loadHistory() {
            const tbody = document.getElementById('history_tbody');
            try {
                const response = await fetch('/api/history');
                const data = await response.json();
                
                tbody.innerHTML = '';
                
                if (data.history.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-gray-500">История рассылок пуста.</td></tr>';
                    return;
                }

                data.history.forEach((item, index) => {
                    const tr = document.createElement('tr');
                    
                    let targetInfo = item.target;
                    let typeLabel = "Индивидуальная";
                    let studentName = "-";
                    let parentName = "-";
                    let className = "-";
                    
                    if (targetInfo === "Всем родителям") {
                        typeLabel = "Массовая (Всем)";
                        studentName = "Все ученики";
                        parentName = "Все родители";
                    } else if (targetInfo.startsWith("Класс")) {
                        typeLabel = "По классу";
                        className = targetInfo.replace("Класс ", "");
                        studentName = `Все ученики (${className})`;
                        parentName = `Родители (${className})`;
                    } else if (targetInfo.includes("(")) {
                        const parts = targetInfo.split(" (реб. ");
                        if (parts.length === 2) {
                            parentName = parts[0];
                            const studentData = parts[1].replace(")", "").split(", ");
                            if (studentData.length === 2) {
                                studentName = studentData[0];
                                className = studentData[1];
                            }
                        }
                    } else {
                         parentName = targetInfo;
                    }

                    tr.innerHTML = `
                        <td class="font-medium text-gray-600">${index + 1}</td>
                        <td>
                            <div class="font-medium">${studentName}</div>
                            ${className !== '-' ? `<div class="text-xs text-gray-500">${className}</div>` : ''}
                        </td>
                        <td>${parentName}</td>
                        <td>
                            <span class="text-truncate cursor-help" title="${item.text.replace(/"/g, '&quot;')}">
                                ${item.text}
                            </span>
                        </td>
                        <td><span class="px-2 py-1 bg-gray-100 text-gray-600 rounded text-xs font-medium">${typeLabel}</span></td>
                        <td><span class="px-2 py-1 bg-green-100 text-green-700 rounded text-xs font-bold">${item.ack_count}</span></td>
                        <td class="text-gray-500 whitespace-nowrap">${item.time}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-red-500">Ошибка загрузки истории.</td></tr>';
            }
        }

        async function loadDb() {
            const tbody = document.getElementById('db_tbody');
            try {
                const response = await fetch('/api/parents');
                const data = await response.json();
                
                tbody.innerHTML = '';
                
                if (data.parents.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-gray-500">База данных пуста.</td></tr>';
                    return;
                }

                data.parents.forEach((p) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="font-medium text-gray-600">${p.id}</td>
                        <td class="font-medium">${p.parent_full_name}</td>
                        <td>${p.child_full_name}</td>
                        <td><span class="px-2 py-1 bg-gray-100 rounded text-xs font-bold">${p.school_class}</span></td>
                        <td class="text-xs">
                            <div class="text-gray-600">${p.email}</div>
                            <div class="text-gray-800 font-medium">${p.phone}</div>
                        </td>
                        <td class="text-xs text-gray-500">${p.address}</td>
                        <td class="text-center space-x-2 whitespace-nowrap">
                            <button onclick="openEditModal(${p.id}, '${p.parent_full_name.replace(/'/g, "\\'")}', '${p.child_full_name.replace(/'/g, "\\'")}', '${p.school_class}', '${p.email}', '${p.phone}', '${p.address.replace(/'/g, "\\'")}')" class="text-blue-500 hover:text-blue-700 p-1">✏️</button>
                            <button onclick="deleteParent(${p.id})" class="text-red-500 hover:text-red-700 p-1">🗑️</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-red-500">Ошибка загрузки базы данных.</td></tr>';
            }
        }

        function toggleFields() {
            const type = document.getElementById('target_type').value;
            const classBlock = document.getElementById('class_block');
            const studentBlock = document.getElementById('student_block');
            const parentBlock = document.getElementById('parent_block');
            
            if (type === 'all') {
                classBlock.classList.add('hidden');
                studentBlock.classList.add('hidden');
                parentBlock.classList.add('hidden');
            } else if (type === 'class') {
                classBlock.classList.remove('hidden');
                studentBlock.classList.add('hidden');
                parentBlock.classList.add('hidden');
            } else if (type === 'student') {
                classBlock.classList.remove('hidden');
                studentBlock.classList.remove('hidden');
                handleClassChange();
            }
        }

        async function handleClassChange() {
            const type = document.getElementById('target_type').value;
            const className = document.getElementById('class_select').value;
            const studentSelect = document.getElementById('student_select');
            const parentBlock = document.getElementById('parent_block');
            
            parentBlock.classList.add('hidden');
            document.getElementById('parent_select').innerHTML = '<option value="">-- Выберите родителя --</option>';

            if (type === 'student' && className) {
                studentSelect.innerHTML = '<option value="">Загрузка...</option>';
                try {
                    const response = await fetch(`/api/students/${className}`);
                    const data = await response.json();
                    currentClassData = data.students;
                    
                    studentSelect.innerHTML = '<option value="">-- Выберите ученика --</option>';
                    
                    const uniqueStudents = [...new Set(currentClassData.map(s => s.child_full_name))];
                    
                    uniqueStudents.forEach(studentName => {
                        const option = document.createElement('option');
                        option.value = studentName;
                        option.textContent = studentName;
                        studentSelect.appendChild(option);
                    });
                } catch (error) {
                    studentSelect.innerHTML = '<option value="">Ошибка загрузки</option>';
                }
            } else {
                studentSelect.innerHTML = '<option value="">-- Выберите ученика --</option>';
                currentClassData = [];
            }
        }

        function handleStudentChange() {
            const studentName = document.getElementById('student_select').value;
            const parentBlock = document.getElementById('parent_block');
            const parentSelect = document.getElementById('parent_select');
            
            if (studentName) {
                parentBlock.classList.remove('hidden');
                parentSelect.innerHTML = '<option value="">-- Выберите родителя --</option>';
                
                const parents = currentClassData.filter(s => s.child_full_name === studentName);
                
                parents.forEach(p => {
                    const option = document.createElement('option');
                    option.value = p.telegram_id;
                    option.textContent = p.parent_full_name;
                    parentSelect.appendChild(option);
                });
            } else {
                parentBlock.classList.add('hidden');
                parentSelect.innerHTML = '<option value="">-- Выберите родителя --</option>';
            }
        }

        async function sendMessage() {
            const targetType = document.getElementById('target_type').value;
            let targetValue = 'all';
            
            if (targetType === 'class') {
                targetValue = document.getElementById('class_select').value;
                if (!targetValue) {
                    showStatus('Выберите класс для отправки!', 'text-red-500');
                    return;
                }
            } else if (targetType === 'student') {
                const studentValue = document.getElementById('student_select').value;
                if (!studentValue) {
                    showStatus('Выберите ученика!', 'text-red-500');
                    return;
                }
                
                targetValue = document.getElementById('parent_select').value;
                if (!targetValue) {
                    showStatus('Выберите родителя для отправки!', 'text-red-500');
                    return;
                }
            }

            const text = document.getElementById('message').value;
            if (!text.trim()) {
                showStatus('Введите текст сообщения!', 'text-red-500');
                return;
            }
            
            showStatus('Отправка...', 'text-blue-500');
            
            try {
                const response = await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target_type: targetType, target_value: targetValue, text: text })
                });
                
                const result = await response.json();
                if (result.status === 'success') {
                    showStatus(`Успешно отправлено ${result.count} родителям.`, 'text-green-500');
                    document.getElementById('message').value = '';
                    document.getElementById('template_select').value = '';
                    
                    setTimeout(() => switchTab('history'), 1500);
                } else {
                    showStatus('Ошибка на сервере при отправке.', 'text-red-500');
                }
            } catch (error) {
                showStatus('Ошибка соединения с сервером.', 'text-red-500');
            }
        }

        function showStatus(text, colorClass) {
            const statusEl = document.getElementById('status');
            statusEl.innerText = text;
            statusEl.className = `mt-4 font-medium text-center ${colorClass}`;
        }

        // CRUD Функции
        function openEditModal(id, parentName, childName, schoolClass, email, phone, address) {
            editingParentId = id;
            document.getElementById('edit_parent_name').value = parentName;
            document.getElementById('edit_child_name').value = childName;
            document.getElementById('edit_school_class').value = schoolClass;
            document.getElementById('edit_email').value = email;
            document.getElementById('edit_phone').value = phone;
            document.getElementById('edit_address').value = address;
            document.getElementById('edit_modal').classList.remove('hidden');
        }

        function closeEditModal() {
            editingParentId = null;
            document.getElementById('edit_modal').classList.add('hidden');
        }

        async function saveParent() {
            if (!editingParentId) return;

            const data = {
                parent_full_name: document.getElementById('edit_parent_name').value,
                child_full_name: document.getElementById('edit_child_name').value,
                school_class: document.getElementById('edit_school_class').value,
                email: document.getElementById('edit_email').value,
                phone: document.getElementById('edit_phone').value,
                address: document.getElementById('edit_address').value
            };

            try {
                const response = await fetch(`/api/parents/${editingParentId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if (result.status === 'success') {
                    closeEditModal();
                    loadDb(); 
                } else {
                    alert('Ошибка при сохранении данных.');
                }
            } catch (error) {
                alert('Ошибка соединения с сервером.');
            }
        }

        async function deleteParent(id) {
            if (!confirm('Вы уверены, что хотите удалить эту запись? Действие нельзя будет отменить.')) return;

            try {
                const response = await fetch(`/api/parents/${id}`, {
                    method: 'DELETE'
                });
                const result = await response.json();
                if (result.status === 'success') {
                    loadDb();
                } else {
                    alert('Ошибка при удалении данных.');
                }
            } catch (error) {
                alert('Ошибка соединения с сервером.');
            }
        }

        loadClasses();
        loadHistory();
    </script>
</body>
</html>
